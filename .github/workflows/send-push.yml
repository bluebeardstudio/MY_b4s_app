name: B4S Daily Push and Check

on:
  schedule:
    - cron: '0 18 * * *' # Запускається щодня о 18:00 UTC (можеш змінити під свій час)
  workflow_dispatch:      # Дозволяє адміну натиснути кнопку «Run workflow» вручну в один клік у GitHub

jobs:
  check-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-push
        run: npm install web-push

      - name: Run Check & Push Script
        env:
          GAS_URL: ${{ secrets.GAS_WEB_APP_URL }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node -e '
            const webpush = require("web-push");
            
            async function run() {
              const gasUrl = process.env.GAS_URL;
              
              if (!gasUrl) {
                console.error("Помилка: Не вказано GAS_URL у секретах");
                return;
              }

              console.Hologram || console.log("Опитування Google Apps Script щодо статусу оновлень о 18:00...");

              try {
                // Запитуємо у GAS список бійців, які не здали план або потребують пінгу
                const response = await fetch(`${gasUrl}?action=checkStatus`);
                const data = await response.json();
                
                if (data.status !== "success" || !data.targets || data.targets.length === 0) {
                  console.log("Усі молодці, оновлення є. Пуші не потрібні.");
                  return;
                }

                webpush.setVapidDetails(
                  "mailto:admin@b4s.local",
                  process.env.VAPID_PUBLIC,
                  process.env.VAPID_PRIVATE
                );

                // Перебираємо кожного, хто не здав звіт, і шлемо пуш
                for (const target of data.targets) {
                  if (!target.token) continue;
                  
                  const subscription = JSON.parse(target.token);
                  const payload = JSON.stringify({
                    title: "Нагадування БЧС 🔔",
                    body: `${target.name}, терміново подайте план на завтра!`
                  });
                  
                  try {
                    await webpush.sendNotification(subscription, payload);
                    console.log(`Пуш успішно надіслано бійцю: ${target.name}`);
                  } catch (err) {
                    console.error(`Помилка відправки для ${target.name}:`, err.message);
                  }
                }

              } catch (e) {
                console.error("Помилка звʼязку з GAS:", e);
              }
            }
            run();
          '
