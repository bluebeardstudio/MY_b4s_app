<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План на завтра / БЧС</title>
    
    <!-- Підключення PWA маніфесту та теги для iOS -->
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="БЧС">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3177/3177440.png">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --success: #22c55e;
            --admin-color: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
            position: relative;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 {
            margin: 0;
            font-size: 20px;
        }
        .admin-toggle {
            background: none;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .admin-toggle.active {
            border-color: var(--admin-color);
            color: var(--admin-color);
            background: rgba(245, 158, 11, 0.1);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        select, input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .status-btn {
            padding: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .status-btn.full-width {
            grid-column: span 2;
        }
        .status-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            font-weight: bold;
        }
        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button.submit-btn:active {
            opacity: 0.8;
        }
        
        .admin-panel {
            display: none;
        }
        .admin-panel.visible {
            display: block;
        }
        .bcs-btn {
            width: 100%;
            padding: 14px;
            background: var(--admin-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .refresh-btn {
            width: 100%;
            padding: 10px;
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 14px;
            transition: background 0.2s;
        }
        .refresh-btn:active {
            background: #475569;
        }
        
        .admin-report-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 14px;
            max-height: 200px;
            overflow-y: auto;
        }
        .report-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid #334155;
        }
        .report-row:last-child {
            border-bottom: none;
        }
        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge.ok { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .badge.no { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .ping-btn {
            background: none;
            border: 1px solid #334155;
            color: #f59e0b;
            border-radius: 4px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 4px;
        }

        .accordion {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px 12px;
            width: 100%;
            text-align: left;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding-left: 2px;
            padding-right: 2px;
        }
        .accordion-content.open {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-top: 4px;
        }
        .team-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 4px;
            background: #0f172a;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .x-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            padding: 0 4px;
        }
        #status-message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        
        .app-version {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #64748b;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2 id="form-title">План на завтра</h2>
        <button class="admin-toggle" id="adminToggleBtn" onclick="toggleAdminMode()">Адмін</button>
    </div>
    
    <div class="admin-panel" id="adminPanel">
        <label style="color: var(--admin-color); margin-bottom: 6px; font-weight: bold;">Керування звітом БЧС:</label>
        
        <button type="button" class="bcs-btn" onclick="submitBcsReport()">Подати БЧС черговому</button>
        <button type="button" class="refresh-btn" onclick="refreshAppData()">🔄 Оновити сторінку та дані</button>

        <label style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">Статус звітів особового складу за сьогодні:</label>
        <div class="admin-report-box" id="adminReportList">
            <div style="font-size: 11px; color: #94a3b8; text-align: center;">Завантаження статусу...</div>
        </div>

        <button type="button" class="accordion" onclick="toggleAccordion('teamAccordion')">
            <span>Список особового складу</span> <span>▼</span>
        </button>
        <div class="accordion-content" id="teamAccordion">
            <div style="display: flex; gap: 6px; margin-bottom: 6px;">
                <input type="text" id="newMemberName" placeholder="Прізвище ім'я..." style="margin-bottom: 0; padding: 6px; font-size: 13px;">
                <button type="button" onclick="addTeamMember()" style="background: var(--admin-color); border: none; color: #000; padding: 0 10px; border-radius: 6px; font-weight: bold; cursor: pointer;">+</button>
            </div>
            <div id="teamManageList"></div>
        </div>

        <button type="button" class="accordion" onclick="toggleAccordion('otherAccordion')">
            <span>Подати за іншого військовослужбовця</span> <span>▼</span>
        </button>
        <div class="accordion-content" id="otherAccordion">
            <label style="font-size: 11px; margin-bottom: 2px;">Оберіть бійця:</label>
            <select id="adminTargetName" style="padding: 6px; font-size: 13px; margin-bottom: 6px;">
                <option value="" disabled selected>Оберіть...</option>
            </select>
            <label style="font-size: 11px; margin-bottom: 2px;">Статус:</label>
            <select id="adminTargetStatus" style="padding: 6px; font-size: 13px; margin-bottom: 6px;">
                <option value="Дистанційно">Дистанційно</option>
                <option value="ППД" selected>ППД</option>
                <option value="Лікування">Лікування</option>
                <option value="Відрядження">Відрядження</option>
                <option value="Відпустка">Відпустка</option>
            </select>
            <input type="text" id="adminTargetTask" placeholder="Задача..." style="padding: 6px; font-size: 13px; margin-bottom: 6px;">
            <button type="button" onclick="submitForOther()" style="width:100%; padding: 8px; background: #334155; color: #fff; border:none; border-radius:6px; cursor:pointer; font-size:12px;">Зберегти звіт за нього</button>
        </div>
    </div>

    <form id="planForm">
        <label for="name">Військовослужбовець:</label>
        <select id="name" required>
            <option value="" disabled selected>Завантаження списку...</option>
        </select>

        <label>Статус / Локація:</label>
        <div class="status-grid">
            <div class="status-btn" data-value="Дистанційно">🏠 Дистанційно</div>
            <div class="status-btn" data-value="ППД">🏢 ППД</div>
            <div class="status-btn" data-value="Лікування">💊 Лікування</div>
            <div class="status-btn" data-value="Відрядження">🚗 Відрядження</div>
            <div class="status-btn full-width" data-value="Відпустка">🏖 Відпустка</div>
        </div>
        <input type="hidden" id="location" required>

        <label for="task">Коротко задачу на завтра:</label>
        <textarea id="task" rows="3" placeholder="Що плануєте робити..." required></textarea>

        <button type="submit" class="submit-btn" id="submitBtn">Надіслати звіт</button>
    </form>
    
    <div id="status-message"></div>

    <!-- Індикатор версії -->
    <div class="app-version">v1.4.01</div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7JjemrNs8yvHuUGfUupBzXmY4kgfWeq3xjsKmTC64qg3CvJKBFemcpepy1yQcBZoAqg/exec";

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker зареєстровано:', reg.scope))
                .catch(err => console.log('Помилка Service Worker:', err));
        });
    }

    let isAdmin = false;
    let currentTeamNames = [];

    function refreshAppData() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
        window.location.reload(true);
    }

    function toggleAdminMode() {
        isAdmin = !isAdmin;
        const btn = document.getElementById('adminToggleBtn');
        const panel = document.getElementById('adminPanel');
        const form = document.getElementById('planForm');
        const formTitle = document.getElementById('form-title');
        
        if (isAdmin) {
            btn.classList.add('active');
            panel.classList.add('visible');
            form.style.display = 'none';
            formTitle.textContent = 'Панель управління БЧС';
            loadAdminReportStatus();
            renderAdminTeamList();
            populateAdminSelects();
        } else {
            btn.classList.remove('active');
            panel.classList.remove('visible');
            form.style.display = 'block';
            formTitle.textContent = 'План на завтра';
        }
    }

    function toggleAccordion(id) {
        const content = document.getElementById(id);
        content.classList.toggle('open');
    }

    async function loadTeamMembers(preselectName = null) {
        const nameSelect = document.getElementById('name');
        try {
            const response = await fetch(`${WEB_APP_URL}?action=getTeam`);
            currentTeamNames = await response.json();
            
            nameSelect.innerHTML = '<option value="" disabled selected>Оберіть зі списку...</option>';
            currentTeamNames.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                nameSelect.appendChild(opt);
            });

            if (preselectName) {
                nameSelect.value = preselectName;
            }
            if (isAdmin) {
                renderAdminTeamList();
                populateAdminSelects();
            }
        } catch (e) {
            nameSelect.innerHTML = '<option value="" disabled selected>Помилка завантаження</option>';
        }
    }

    async function loadAdminReportStatus() {
        const reportBox = document.getElementById('adminReportList');
        reportBox.innerHTML = '<div style="font-size: 11px; color: #94a3b8; text-align: center;">Оновлення статусу...</div>';
        
        try {
            const response = await fetch(`${WEB_APP_URL}?action=getAdminReportStatus`);
            const reportData = await response.json();
            
            reportBox.innerHTML = '';
            if (reportData.length === 0) {
                reportBox.innerHTML = '<div style="font-size: 11px; color: #94a3b8; text-align: center;">Склад порожній</div>';
                return;
            }

            reportData.forEach(item => {
                const row = document.createElement('div');
                row.className = 'report-row';
                
                let badgeHtml = item.submitted 
                    ? `<span class="badge ok" title="${item.task}">${item.status}</span>` 
                    : `<span class="badge no">Не здано</span> <button type="button" class="ping-btn" onclick="pingMember('${item.name}')">Пінганути</button>`;
                
                row.innerHTML = `<span>${item.name}</span> <div>${badgeHtml}</div>`;
                reportBox.appendChild(row);
            });
        } catch (e) {
            reportBox.innerHTML = '<div style="font-size: 11px; color: var(--danger); text-align: center;">Помилка завантаження</div>';
        }
    }

    function pingMember(name) {
        alert(`Надіслано сигнал нагадування для: ${name}`);
    }

    function renderAdminTeamList() {
        const listContainer = document.getElementById('teamManageList');
        listContainer.innerHTML = '';
        currentTeamNames.forEach(name => {
            const item = document.createElement('div');
            item.className = 'team-item';
            item.innerHTML = `
                <span>${name}</span>
                <button type="button" class="x-btn" onclick="removeTeamMember('${name}')" title="Видалити">×</button>
            `;
            listContainer.appendChild(item);
        });
    }

    function populateAdminSelects() {
        const adminSelect = document.getElementById('adminTargetName');
        adminSelect.innerHTML = '<option value="" disabled selected>Оберіть бійця...</option>';
        currentTeamNames.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            adminSelect.appendChild(opt);
        });
    }

    async function addTeamMember() {
        const input = document.getElementById('newMemberName');
        const name = input.value.trim();
        if (!name) return;

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'addMember', name: name })
            });
            input.value = '';
            setTimeout(async () => { 
                await loadTeamMembers(); 
                await loadAdminReportStatus();
            }, 1000);
        } catch (e) {
            alert('Помилка додавання');
        }
    }

    async function removeTeamMember(name) {
        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'removeMember', name: name })
            });
            setTimeout(async () => { 
                await loadTeamMembers(); 
                await loadAdminReportStatus();
            }, 1000);
        } catch (e) {
            alert('Помилка видалення');
        }
    }

    async function submitBcsReport() {
        const statusMsg = document.getElementById('status-message');
        statusMsg.style.color = '#f59e0b';
        statusMsg.textContent = 'Перевірка звітів особового складу...';

        try {
            const response = await fetch(`${WEB_APP_URL}?action=getBcsReport`);
            const result = await response.json();

            if (!result.ready) {
                alert(`Увага! Не всі подали звіти ЗА СЬОГОДНІ.\n\nЩе не здали: ${result.missing.join(', ')}`);
                statusMsg.textContent = 'Подача відкладена: є заборгованість по звітах.';
                loadAdminReportStatus();
                return;
            }

            window.open(result.reportUrl, '_blank');

            statusMsg.style.color = '#22c55e';
            statusMsg.textContent = 'Звіт БЧС успішно сформовано та відкрито!';
        } catch (e) {
            statusMsg.style.color = '#ef4444';
            statusMsg.textContent = 'Помилка формування звіту.';
        }
    }

    async function submitForOther() {
        const targetName = document.getElementById('adminTargetName').value;
        const targetStatus = document.getElementById('adminTargetStatus').value;
        const targetTask = document.getElementById('adminTargetTask').value.trim();

        if (!targetName) {
            alert('Оберіть військовослужбовця!');
            return;
        }
        if (!targetTask) {
            alert('Введіть задачу!');
            return;
        }

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: targetName, location: targetStatus, task: targetTask })
            });
            document.getElementById('adminTargetTask').value = '';
            alert(`Звіт за ${targetName} успішно записано на сьогодні!`);
            await loadAdminReportStatus();
        } catch (e) {
            alert('Помилка надсилання');
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const savedName = localStorage.getItem('b4s_user_name');
        const savedLocation = localStorage.getItem('b4s_user_location');
        const savedTask = localStorage.getItem('b4s_user_task');

        await loadTeamMembers(savedName);

        if (savedLocation) {
            document.getElementById('location').value = savedLocation;
            document.querySelectorAll('.status-btn').forEach(btn => {
                if (btn.getAttribute('data-value') === savedLocation) {
                    btn.classList.add('active');
                }
            });
        }

        if (savedTask) {
            document.getElementById('task').value = savedTask;
        }
    });

    const statusBtns = document.querySelectorAll('.status-btn');
    const locationInput = document.getElementById('location');

    statusBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            statusBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            locationInput.value = btn.getAttribute('data-value');
        });
    });

    const form = document.getElementById('planForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('status-message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!locationInput.value) {
            alert('Будь ласка, оберіть статус!');
            return;
        }

        const selectedName = document.getElementById('name').value;
        const selectedLocation = locationInput.value;
        const selectedTask = document.getElementById('task').value;

        const formData = {
            name: selectedName,
            location: selectedLocation,
            task: selectedTask
        };

        submitBtn.disabled = true;
        submitBtn.textContent = 'Відправляємо...';
        statusMessage.textContent = '';

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            if (!isAdmin) {
                localStorage.setItem('b4s_user_name', selectedName);
                localStorage.setItem('b4s_user_location', selectedLocation);
                localStorage.setItem('b4s_user_task', selectedTask);
            }

            statusMessage.style.color = '#22c55e';
            statusMessage.textContent = 'Звіт успішно надіслано! Дякуємо.';
        } catch (error) {
            statusMessage.style.color = '#ef4444';
            statusMessage.textContent = 'Помилка надсилання.';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Надіслати звіт';
        }
    });
</script>

</body>
</html>
