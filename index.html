<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План на завтра</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --success: #22c55e;
            --admin-color: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
            position: relative;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 {
            margin: 0;
            font-size: 22px;
        }
        .admin-toggle {
            background: none;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .admin-toggle.active {
            border-color: var(--admin-color);
            color: var(--admin-color);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        select, input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .status-btn {
            padding: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .status-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            font-weight: bold;
        }
        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button.submit-btn:active {
            opacity: 0.8;
        }
        .admin-box {
            background: #0f172a;
            border: 1px dashed var(--admin-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .admin-box.visible {
            display: block;
        }
        .team-manage-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            border-top: 1px solid #334155;
            padding-top: 8px;
        }
        .team-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 6px;
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
        }
        #status-message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2 id="form-title">План на завтра ⚡️</h2>
        <button class="admin-toggle" id="adminToggleBtn" onclick="toggleAdminMode()">⚙️ Адмін</button>
    </div>
    
    <!-- Панель админа: управление командой -->
    <div class="admin-box" id="adminBox">
        <label style="color: var(--admin-color); margin-bottom: 6px;">👑 Керування складом команди:</label>
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <input type="text" id="newMemberName" placeholder="Нове ім'я..." style="margin-bottom: 0; padding: 8px;">
            <button type="button" onclick="addTeamMember()" style="background: var(--admin-color); border: none; color: #000; padding: 0 14px; border-radius: 8px; font-weight: bold; cursor: pointer;">Додати</button>
        </div>
        <div class="team-manage-list" id="teamManageList">
            <!-- Список динамически заполняется -->
        </div>
    </div>

    <form id="planForm">
        <!-- Выбор сотрудника -->
        <label for="name">Співробітник:</label>
        <select id="name" required>
            <option value="" disabled selected>Завантаження списку...</option>
        </select>

        <!-- Статус -->
        <label>Статус / Локація:</label>
        <div class="status-grid">
            <div class="status-btn" data-value="Дистанційно">🏠 Дистанційно</div>
            <div class="status-btn" data-value="В строю">🏢 В строю</div>
            <div class="status-btn" data-value="Відпустка">🏖 Відпустка</div>
            <div class="status-btn" data-value="Відрядження">🚗 Відрядження</div>
        </div>
        <input type="hidden" id="location" required>

        <!-- Задача -->
        <label for="task">Коротко задачу на завтра:</label>
        <textarea id="task" rows="3" placeholder="Що плануєте робити..." required></textarea>

        <button type="submit" class="submit-btn" id="submitBtn">Надіслати звіт</button>
    </form>
    
    <div id="status-message"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7JjemrNs8yvHuUGfUupBzXmY4kgfWeq3xjsKmTC64qg3CvJKBFemcpepy1yQcBZoAqg/exec";

    let isAdmin = false;
    let currentTeamNames = [];

    function toggleAdminMode() {
        isAdmin = !isAdmin;
        const btn = document.getElementById('adminToggleBtn');
        const box = document.getElementById('adminBox');
        const nameSelect = document.getElementById('name');
        
        if (isAdmin) {
            btn.classList.add('active');
            box.classList.add('visible');
            renderAdminTeamList();
            loadTeamMembers(localStorage.getItem('b4s_user_name'));
        } else {
            btn.classList.remove('active');
            box.classList.remove('visible');
            const savedName = localStorage.getItem('b4s_user_name');
            if (savedName) nameSelect.value = savedName;
        }
    }

    // Загрузка списка команды из Google Таблицы
    async function loadTeamMembers(preselectName = null) {
        const nameSelect = document.getElementById('name');
        try {
            const response = await fetch(`${WEB_APP_URL}?action=getTeam`);
            currentTeamNames = await response.json();
            
            nameSelect.innerHTML = '<option value="" disabled selected>Оберіть зі списку...</option>';
            currentTeamNames.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                nameSelect.appendChild(opt);
            });

            if (preselectName) {
                nameSelect.value = preselectName;
            }
            if (isAdmin) {
                renderAdminTeamList();
            }
        } catch (e) {
            nameSelect.innerHTML = '<option value="" disabled selected>Помилка завантаження списку</option>';
        }
    }

    function renderAdminTeamList() {
        const listContainer = document.getElementById('teamManageList');
        listContainer.innerHTML = '';
        if (currentTeamNames.length === 0) {
            listContainer.innerHTML = '<div style="font-size:12px; color:#94a3b8; text-align:center;">Список порожній</div>';
            return;
        }
        currentTeamNames.forEach(name => {
            const item = document.createElement('div');
            item.className = 'team-item';
            item.innerHTML = `
                <span>${name}</span>
                <button type="button" class="delete-btn" onclick="removeTeamMember('${name}')">❌ Видалити</button>
            `;
            listContainer.appendChild(item);
        });
    }

    async function addTeamMember() {
        const input = document.getElementById('newMemberName');
        const name = input.value.trim();
        if (!name) return;

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'addMember', name: name })
            });
            input.value = '';
            setTimeout(async () => {
                await loadTeamMembers();
            }, 1000); // Небольшая задержка на запись в таблицу
        } catch (e) {
            alert('Помилка додавання');
        }
    }

    async function removeTeamMember(name) {
        if (!confirm(`Видалити ${name} зі списку команди?`)) return;

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'removeMember', name: name })
            });
            setTimeout(async () => {
                await loadTeamMembers();
            }, 1000);
        } catch (e) {
            alert('Помилка видалення');
        }
    }

    // Инициализация при загрузке страницы
    window.addEventListener('DOMContentLoaded', async () => {
        const savedName = localStorage.getItem('b4s_user_name');
        const savedLocation = localStorage.getItem('b4s_user_location');
        const savedTask = localStorage.getItem('b4s_user_task');

        await loadTeamMembers(savedName);

        if (savedLocation) {
            document.getElementById('location').value = savedLocation;
            document.querySelectorAll('.status-btn').forEach(btn => {
                if (btn.getAttribute('data-value') === savedLocation) {
                    btn.classList.add('active');
                }
            });
        }

        if (savedTask) {
            document.getElementById('task').value = savedTask;
        }
    });

    // Выбор статуса
    const statusBtns = document.querySelectorAll('.status-btn');
    const locationInput = document.getElementById('location');

    statusBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            statusBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            locationInput.value = btn.getAttribute('data-value');
        });
    });

    // Отправка формы отчета
    const form = document.getElementById('planForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('status-message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!locationInput.value) {
            alert('Будь ласка, оберіть статус!');
            return;
        }

        const selectedName = document.getElementById('name').value;
        const selectedLocation = locationInput.value;
        const selectedTask = document.getElementById('task').value;

        const formData = {
            name: selectedName,
            location: selectedLocation,
            task: selectedTask
        };

        submitBtn.disabled = true;
        submitBtn.textContent = 'Відправляємо...';
        statusMessage.textContent = '';

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            if (!isAdmin) {
                localStorage.setItem('b4s_user_name', selectedName);
                localStorage.setItem('b4s_user_location', selectedLocation);
                localStorage.setItem('b4s_user_task', selectedTask);
            }

            statusMessage.style.color = '#22c55e';
            statusMessage.textContent = isAdmin ? `✅ Звіт за ${selectedName} успішно надіслано!` : '✅ Звіт успішно надіслано! Дякуємо.';
            
        } catch (error) {
            statusMessage.style.color = '#ef4444';
            statusMessage.textContent = '❌ Помилка надсилання. Спробуйте ще раз.';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Надіслати звіт';
        }
    });
</script>

</body>
</html>
