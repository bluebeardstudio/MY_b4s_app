<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План на завтра</title>
    <!-- Подключаем шрифты и стили для красоты -->
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        select, input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .status-btn {
            padding: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .status-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            font-weight: bold;
        }
        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button.submit-btn:active {
            opacity: 0.8;
        }
        #status-message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>План на завтра ⚡️</h2>
    
    <form id="planForm">
        <!-- Выбор сотрудника -->
        <label for="name">Ваше прізвище / ім'я:</label>
        <select id="name" required>
            <місце_для_списку_людей>
            <option value="" disabled selected>Оберіть зі списку...</option>
            <option value="Вова Власенко">Вова Власенко</option>
            <option value="Співробітник 2">Співробітник 2</option>
            <option value="Співробітник 3">Співробітник 3</option>
        </select>

        <!-- Выбор локации / статуса (соответствует вашим колонкам в таблице) -->
        <label>Статус / Локація:</label>
        <div class="status-grid">
            <div class="status-btn" data-value="Дистанційно">🏠 Дистанційно</div>
            <div class="status-btn" data-value="В строю">🏢 В строю</div>
            <div class="status-btn" data-value="Відпустка">🏖 Відпустка</div>
            <div class="status-btn" data-value="Відрядження">🚗 Відрядження</div>
        </div>
        <input type="hidden" id="location" required>

        <!-- Описание задачи -->
        <label for="task">Коротко задачу на завтра:</label>
        <textarea id="task" rows="3" placeholder="Що плануєте робити..." required></textarea>

        <!-- Кнопка отправки -->
        <button type="submit" class="submit-btn" id="submitBtn">Надіслати звіт</button>
    </form>
    
    <div id="status-message"></div>
</div>

<script>
    // Логика выбора кнопок статуса
    const statusBtns = document.querySelectorAll('.status-btn');
    const locationInput = document.getElementById('location');

    statusBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            statusBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            locationInput.value = btn.getAttribute('data-value');
        });
    });

    // Обработка отправки формы
    const form = document.getElementById('planForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('status-message');

    // СЮДА ВСТАВЬТЕ ВАШУ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT (заканчивается на /exec)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7JjemrNs8yvHuUGfUupBzXmY4kgfWeq3xjsKmTC64qg3CvJKBFemcpepy1yQcBZoAqg/exec";

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!locationInput.value) {
            alert('Будь ласка, оберіть статус!');
            return;
        }

        const formData = {
            name: document.getElementById('name').value,
            location: locationInput.value,
            task: document.getElementById('task').value
        };

        submitBtn.disabled = true;
        submitBtn.textContent = 'Відправляємо...';
        statusMessage.textContent = '';

        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // Важно для Google Apps Script
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });

            statusMessage.style.color = '#22c55e';
            statusMessage.textContent = '✅ Звіт успішно надіслано! Дякуємо.';
            form.reset();
            statusBtns.forEach(b => b.classList.remove('active'));
            locationInput.value = '';
        } catch (error) {
            statusMessage.style.color = '#ef4444';
            statusMessage.textContent = '❌ Помилка надсилання. Спробуйте ще раз.';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Надіслати звіт';
        }
    });
</script>

</body>
</html>
